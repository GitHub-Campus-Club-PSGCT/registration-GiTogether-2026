# Adds a throwaway MongoDB for trying things out. Use it with compose.yaml, as the README shows.
services:
  app:
    environment:
      MONGODB_URI: mongodb://mongo:27017/gitogether
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
