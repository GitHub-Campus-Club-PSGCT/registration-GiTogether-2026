name: Keep alive

# Wakes the API so registering stays quick. Needs a SITE_URL repository variable, like https://your-site.vercel.app
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - run: curl --fail --silent --show-error --max-time 30 --retry 2 "${{ vars.SITE_URL }}/api/register"
