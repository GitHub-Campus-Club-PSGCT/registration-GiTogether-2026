name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registration/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registration/backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registration/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registration/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp registration/backend/.env.example registration/backend/.env
      - run: docker compose -f compose.yaml -f compose.local.yaml up --build --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:4001/api/health
      - run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4001/admin/dashboard
      - if: failure()
        run: docker compose -f compose.yaml -f compose.local.yaml logs
